<!DOCTYPE html>
<html>
<head>
<title>Coin Flip</title>

<style>
body{
font-family: Arial;
text-align:center;
background:#0f172a;
color:white;
margin-top:100px;
}

button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#22c55e;
color:white;
}

button:hover{
background:#16a34a;
}

#result{
font-size:40px;
margin-top:30px;
}
</style>

</head>

<body>

<h1>🪙 Coin Flip</h1>

<button onclick="flipCoin()">Flip Coin</button>

<div id="result">?</div>

<script>

function flipCoin(){

let random = Math.random();

if(random < 0.5){
document.getElementById("result").innerHTML = "Heads";
}else{
document.getElementById("result").innerHTML = "Tails";
}

}

</script>

</body>
</html>
